name = "bodhai-api"
main = "workers/api/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

routes = [
  { pattern = "api.bodhai.aarushdevworld.workers.dev", custom_domain = true }
]

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "bodhai-db"
database_id = "d0cb6d6f-b338-42d4-8eb0-19a757548112"
migrations_dir = "db/migrations"

